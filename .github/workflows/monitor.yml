name: Trade Monitor

# NOTE: GitHub Actions native cron is unreliable (~90% skipped on weekends).
# Cron is now driven by Cloudflare Worker — see worker/wrangler.toml [triggers].
# CF Worker pings workflow_dispatch every 5 min (99%+ reliability).
on:
  schedule:
    - cron: '*/5 * * * *'    # backup cron if CF Worker is dead
  workflow_dispatch:
    inputs:
      simulate:
        description: "Send simulate alert to verify pipeline (no real detection)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    branches: [master]

permissions:
  contents: write            # to commit monitor_state.json back

concurrency:
  group: monitor
  cancel-in-progress: false  # don't kill a running check if another fires

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pandas ccxt matplotlib mplfinance

      - name: Cache 1m BTC data (V+M needs 90d)
        uses: actions/cache@v4
        with:
          path: .cache_1m_btcusdt.pkl
          key: btc-1m-cache-${{ github.run_id }}
          restore-keys: btc-1m-cache-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SIMULATE_ALERT:     ${{ inputs.simulate == 'true' && '1' || '' }}
        run: python monitor_ci.py

      - name: Commit state + log + active trades if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=""
          [ -n "$(git status --porcelain monitor_state.json)" ] && changed="$changed monitor_state.json"
          [ -n "$(git status --porcelain alerts_log.json)"  ]   && changed="$changed alerts_log.json"
          [ -n "$(git status --porcelain active_trades.json)" ] && changed="$changed active_trades.json"
          if [ -z "$changed" ]; then
            echo "No state changes to commit"
            exit 0
          fi
          git add $changed
          git commit -m "Update monitor state + log + active trades [skip ci]"
          # Retry push up to 3 times — concurrent runs may cause non-fast-forward
          for i in 1 2 3; do
            if git push 2>&1; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed — pull rebase + retry"
            git pull --rebase origin master || git rebase --abort
            sleep 2
          done
          echo "All push attempts failed — state not persisted (will retry next run)"
          exit 1

name: Trade Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:         # allow manual trigger from Actions tab

permissions:
  contents: write            # to commit monitor_state.json back

concurrency:
  group: monitor
  cancel-in-progress: false  # don't kill a running check if another fires

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pandas ccxt matplotlib mplfinance

      - name: Cache 1m BTC data (V+M needs 90d)
        uses: actions/cache@v4
        with:
          path: .cache_1m_btcusdt.pkl
          key: btc-1m-cache-${{ github.run_id }}
          restore-keys: btc-1m-cache-

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_ci.py

      - name: Commit state + alerts log if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=""
          [ -n "$(git status --porcelain monitor_state.json)" ] && changed="$changed monitor_state.json"
          [ -n "$(git status --porcelain alerts_log.json)"  ] && changed="$changed alerts_log.json"
          if [ -n "$changed" ]; then
            git add $changed
            git commit -m "Update monitor state + log [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi

name = "trade-amd-vm-bot"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Secrets to set via `wrangler secret put <NAME>`:
#   TELEGRAM_BOT_TOKEN  — from BotFather
#   TELEGRAM_CHAT_ID    — your private chat id (security gate)
#   GITHUB_TOKEN        — fine-grained PAT, Actions: write on trade-amd-vm
#   GITHUB_REPO         — "sirichaiphumsawat/trade-amd-vm"

# Cron Triggers — reliable replacement for GitHub Actions cron
# Cloudflare Workers crons are 99%+ reliable vs GH Actions ~10% on weekends.
# This pings GitHub workflow_dispatch every 5 minutes — GH workflow itself
# runs the heavy lifting (vm_backtest 90d data).
[triggers]
crons = ["*/5 * * * *"]

[observability.logs]
enabled = true
